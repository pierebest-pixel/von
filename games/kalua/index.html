<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Les Échoués de Kalua</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <!-- Commandes en jeu -->
  <div id="hud" hidden>
    <button class="round back" id="menu-btn" aria-label="Menu"><span class="burger"></span></button>
    <div class="badge" id="badge"></div>
    <canvas class="minimap" id="minimap" aria-label="Mini-carte"></canvas>
    <div class="dpad" id="dpad">
      <b data-d="u">▲</b><b data-d="l">◀</b><b class="mid"></b><b data-d="r">▶</b><b data-d="d">▼</b>
    </div>
    <div class="acts">
      <button class="act run" data-a="run"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>SPRINT</button>
      <button class="act dodge" data-a="dodge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M17.5 2.5v3.6h-3.6"/></svg>ESQUIVE</button>
      <button class="act grab" data-a="grab"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V6.5a1.5 1.5 0 0 1 3 0V11M10 10V5a1.5 1.5 0 0 1 3 0v5M13 10V6a1.5 1.5 0 0 1 3 0v6M16 9a1.5 1.5 0 0 1 3 0v4a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2-3.5a1.4 1.4 0 0 1 2.4-1.5L7 13"/></svg>RAMASSER</button>
      <button class="act hit" data-a="hit"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-3 3-6-6z" fill="#fff"/><path d="M12.5 8.5L4 17l3 3 8.5-8.5"/></svg>TAPER</button>
      <button class="act magic off" data-a="magic" id="magic-btn"><span>✨</span>CHANT</button>
      <button class="act swap" data-a="swap" id="swap-btn" hidden aria-label="Changer de chant">⇄</button>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="pickups" id="pickups"></div>
  </div>

  <!-- Écrans (chargement, créateur, mes îles) -->
  <div id="ui"></div>

  <script src="../von-sdk.js"></script>
  <script src="../../firebase-config.js"></script>
  <script src="avatar.js"></script>
  <script src="net.js"></script>
  <script src="map.js"></script>
  <script src="world.js"></script>
  <script src="creatures.js"></script>
  <script src="music.js"></script>
  <script src="items.js"></script>
  <script src="items-data.js"></script>
  <script src="state.js"></script>
  <script src="dialog.js"></script>
  <script src="npcs.js"></script>
  <script src="bestiary.js"></script>
  <script src="action.js"></script>
  <script src="rtbosses.js"></script>
  <script src="battle.js"></script>
  <script src="cutscene.js"></script>
  <script src="arenas.js"></script>
  <script src="dungeon.js"></script>
  <script src="caves-1.js"></script>
  <script src="caves-2.js"></script>
  <script src="caves-3.js"></script>
  <script src="caves-4.js"></script>
  <script src="caves-5.js"></script>
  <script src="caves-iles.js"></script>
  <script src="lore.js"></script>
  <script src="guide.js"></script>
  <script src="quests.js"></script>
  <script src="quests2.js"></script>
  <script src="story.js"></script>
  <script src="buildings.js"></script>
  <script src="decor.js"></script>
  <script src="outdoor.js"></script>
  <script src="clothes.js"></script>
  <script src="village.js"></script>
  <script src="services.js"></script>
  <script src="house.js"></script>
  <script src="shop.js"></script>
  <script src="village2.js"></script>
  <script src="menus.js"></script>
  <script src="game.js"></script>
  <script src="play.js"></script>
</body>
</html>
