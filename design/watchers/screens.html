<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{background:#000;font-family:"Silkscreen",monospace;color:#f0ecf5;height:100vh;overflow:hidden}
canvas{image-rendering:pixelated}
.full{position:fixed;inset:0;width:100%;height:100%}
.title{position:fixed;top:84px;width:100%;text-align:center;font-size:46px;font-weight:700;letter-spacing:.06em;color:#d9fff6;text-shadow:0 0 0 #000,3px 3px 0 #07050a,0 0 18px rgba(94,224,198,.8)}
.sub{position:fixed;top:146px;width:100%;text-align:center;font-size:12px;letter-spacing:.3em;color:#c46fb0}
.tmenu{position:fixed;left:50px;right:50px;bottom:84px;display:flex;flex-direction:column;gap:12px}
.tbtn{border-radius:16px;padding:16px;text-align:center;font-size:16px;font-weight:700;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}
.tbtn.p{background:#5ee0c6;color:#0b2a24;border:none}
.ver{position:fixed;bottom:40px;width:100%;text-align:center;font-size:10px;color:#6b6575}
.dlg{position:fixed;left:12px;right:12px;bottom:230px;background:#15111c;border:3px solid #e8e3f0;box-shadow:0 0 0 3px #15111c,inset 0 0 0 2px #3a3348;padding:16px 16px 22px;font-size:14px;line-height:1.6}
.dlg .who{position:absolute;top:-17px;left:14px;background:#5ee0c6;color:#0b2a24;font-weight:700;font-size:12px;padding:3px 10px;border:3px solid #15111c}
.dlg .arrow{position:absolute;right:14px;bottom:6px;color:#5ee0c6;font-size:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:rgba(24,22,30,.97);border-radius:22px 22px 0 0;padding:10px 16px 34px}
.grab{width:40px;height:5px;border-radius:3px;background:#4a4555;margin:0 auto 14px}
.sheet h2{font-size:15px;padding:0 4px 10px;color:#b9b2c8;font-weight:400}
.grp{background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px}
.it+.it{border-top:1px solid rgba(255,255,255,.08)}
.it .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.it .ic svg{width:19px;height:19px}
.it .l{flex:1}.it .v{color:#8e8e97;font-size:12px}.it .c{color:#5a5a63}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:6px 0 8px}.gi{display:flex;flex-direction:column;align-items:center;gap:7px}.gic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.35)}.gic svg{width:32px;height:32px}.gi b{font-size:12px;font-weight:400}.gi small{font-size:9px;color:#8e8e97;height:10px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45)}
</style></head><body>
<script src="../../games/watchers/backgrounds.js"></script><script src="../../games/watchers/art.js"></script><script src="../../games/watchers/logo.js"></script>
<script>
const m=new URLSearchParams(location.search).get('m');
if(m==='title'){
  document.body.style.background='#12061e';const c=BATTLE_BG.draw(4,130,282,{platforms:false});c.className='full';c.style.top='110px';document.body.append(c);
  document.fonts.load('700 160px Silkscreen').then(()=>{const lg=drawDripLogo('WATCHERS','700 120px Silkscreen',{w:820,h:330,seed:11});lg.style.cssText='position:fixed;left:3%;width:94%;top:40px;image-rendering:auto;filter:drop-shadow(0 0 10px rgba(94,224,198,.55))';document.body.append(lg);window.ok=1;});
  const hero=ART.hero('down');hero.style.cssText='position:fixed;left:50%;top:548px;width:80px;height:80px;margin-left:-40px';document.body.append(hero);
  const glow=document.createElement('div');glow.style.cssText='position:fixed;left:50%;top:600px;width:120px;height:60px;margin-left:-60px;background:radial-gradient(rgba(94,224,198,.35),transparent 70%)';document.body.append(glow);
  document.body.insertAdjacentHTML('beforeend',`<div class="sub" style="top:208px">LE SOLEIL-CŒUR S'ÉTEINT</div>
  <div class="tmenu"><div class="tbtn p">Continuer</div><div class="tbtn">Nouvelle partie</div></div><div class="ver">Toucher pour commencer · v1.0</div>`);
} else {
  const f=document.createElement('iframe');f.src='explore.html';f.className='full';f.style.border='0';document.body.append(f);
  if(m==='dlg') document.body.insertAdjacentHTML('beforeend',`<div class="dlg"><div class="who">Vieille Maëlle</div>Ta sœur est passée par ici, il y a trois hivers… Elle portait la même lanterne que toi. Elle n'est jamais revenue de la forêt.<div class="arrow">▼</div></div>`);
  if(m==='menu'){
    const I=(c,svg,l,v='')=>`<div class="it"><span class="ic" style="background:${c}">${svg}</span><span class="l">${l}</span><span class="v">${v}</span><span class="c">›</span></div>`;
    const S={team:'<svg viewBox="0 0 24 24" fill="#fff"><circle cx="6" cy="9" r="2.2"/><circle cx="10" cy="5.5" r="2.2"/><circle cx="14" cy="5.5" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M12 11c-3.2 0-6 3.6-6 6.2 0 1.8 1.6 2.3 3 1.8 1.2-.4 2-.7 3-.7s1.8.3 3 .7c1.4.5 3 0 3-1.8 0-2.6-2.8-6.2-6-6.2z"/></svg>',
     bag:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
     dex:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/></svg>',
     q:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11"/><circle cx="5" cy="18" r="1.3"/></svg>',
     map:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
     save:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>'};
    const G=(c,svg,l,v='')=>`<div class="gi"><span class="gic" style="background:${c}">${svg}</span><b>${l}</b><small>${v}</small></div>`;
    document.body.insertAdjacentHTML('beforeend',`<div class="dim"></div><div class="sheet"><div class="grab"></div><h2>Menu</h2>
    <div class="grid">${G('#30d158',S.team,'Équipe','4 / 6')}${G('#ff9f0a',S.bag,'Sac','')}${G('#bf5af2',S.dex,'Carnet','5 capturés')}${G('#0a84ff',S.q,'Quêtes','3 en cours')}${G('#64d2ff',S.map,'Carte','')}${G('#8e8e93',S.save,'Sauver','')}</div></div>`);
  }
}
</script></body></html>
