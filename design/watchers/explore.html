<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:"Pixelify Sans",monospace;color:#fff}
canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated}
.banner{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:rgba(15,12,22,.82);border:3px solid #5ee0c6;padding:6px 16px;font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap;box-shadow:0 0 0 3px #15111c}
.menu{position:fixed;top:54px;right:14px;width:44px;height:44px;background:rgba(15,12,22,.75);border:3px solid #8a8496;display:grid;place-items:center;gap:0}
.menu i{display:block;width:20px;height:3px;background:#e8e3f0;margin:2px 0}
.joy{position:fixed;left:26px;bottom:44px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.10);border:3px solid rgba(255,255,255,.28)}
.joy b{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.6);transform:translate(14px,-10px)}
.btnA{position:fixed;right:22px;bottom:96px;width:74px;height:74px;border-radius:50%;background:rgba(94,224,198,.35);border:3px solid #5ee0c6;display:grid;place-items:center;font-size:30px;font-weight:700;color:#d9fff6}
.btnB{position:fixed;right:104px;bottom:44px;width:58px;height:58px;border-radius:50%;background:rgba(139,92,246,.30);border:3px solid #8b5cf6;display:grid;place-items:center;font-size:24px;font-weight:700;color:#e9e0ff}
.light{position:fixed;left:16px;top:58px;display:flex;align-items:center;gap:6px;font-size:14px}
.light .bar{width:70px;height:10px;border:2px solid #15111c;background:#1d3a35}.light .bar span{display:block;height:100%;width:72%;background:#5ee0c6}
</style></head><body><canvas id="c"></canvas>
<div class="banner">Vallée des Brumes</div>
<div class="menu"><div><i></i><i></i><i></i></div></div>
<div class="joy"><b></b></div><div class="btnA">A</div><div class="btnB">B</div>
<script src="../../games/watchers/art.js"></script>
<script>
const S=3, W=Math.ceil(innerWidth/S), H=Math.ceil(innerHeight/S);
const c=document.getElementById('c'); c.width=W; c.height=H; const g=c.getContext('2d');
const A=ART,T=16;
// carte 12 x 20 (les arbres T occupent 2x2)
const M=[
"TTTTTTTTTTTT",
"TTTTTTTTTTTT",
"TT.,..f..,TT",
"TT.HHHH..,TT",
"TT.HHHH.f.TT",
"TT.HHHH.,.TT",
"TT.HHHH..mTT",
"TT..pp..S.TT",
"TT,.pp....TT",
"TTFFppFFF.TT",
"TT..pp..,.TT",
"TTwwpp\"\"\"\"TT",
"TTwwpp\"\"\"\"TT",
"TT.,pp\"\"\"rTT",
"TTf.pp\"\"\".TT",
"TT..pp..m.TT",
"TT.,pp,...TT",
"TT..pp....TT",
"TTTTppTTTTTT",
"TTTTppTTTTTT"];
const tiles={'.':A.grass(1),',':A.grass(2),'p':A.path(3),'"':A.tallGrass(),'w':A.water(0),'f':A.flowers(4),'r':A.rock(),'m':A.grass(5),'F':A.fence(),'S':A.sign()};
const tree=A.tree(), house=A.house(), mush=A.mushroomSprite();
const ox=Math.floor(W/2-(5*T+8)), oy=Math.floor(H/2-(12*T+10));
g.fillStyle='#0d140f';g.fillRect(0,0,W,H);
for(let y=-4;y<24;y++)for(let x=-4;x<16;x++){const ch=(M[y]||'')[x]; g.drawImage(tiles[ch]&&ch!=='T'&&ch!=='H'?tiles[ch]:tiles['.'],ox+x*T,oy+y*T);}
// arbres (bord) dessinés par paires
for(let y=-4;y<24;y+=2)for(let x=-4;x<16;x+=2){const ch=(M[y]||'')[x]; if(ch==='T'||ch===undefined) g.drawImage(tree,ox+x*T,oy+y*T-4);}
g.drawImage(house,ox+3*T,oy+3*T-2);
g.drawImage(A.npc(),ox+8*T,oy+8*T);
const px=ox+4*T+8, py=oy+12*T; g.drawImage(A.hero(),px,py);
// brume : obscurité autour de la lanterne
const fog=g.createRadialGradient(px+8,py+8,36,px+8,py+8,125);
fog.addColorStop(0,'rgba(40,50,60,0)');fog.addColorStop(.5,'rgba(60,72,86,.42)');fog.addColorStop(1,'rgba(38,44,56,.9)');
g.fillStyle=fog;g.fillRect(0,0,W,H);
// halo du champignon
for(const [mx,my] of [[9,6],[8,15]]){const h=g.createRadialGradient(ox+mx*T+8,oy+my*T+8,2,ox+mx*T+8,oy+my*T+8,26);h.addColorStop(0,'rgba(94,224,198,.55)');h.addColorStop(1,'rgba(94,224,198,0)');g.fillStyle=h;g.fillRect(0,0,W,H);g.drawImage(mush,ox+mx*T,oy+my*T);}
</script></body></html>
